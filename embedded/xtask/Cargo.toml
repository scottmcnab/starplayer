[package]
name = "starplayer-embedded-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Build orchestration for the StarPlayer firmware workspace: build, image, size, flash, monitor."
publish = false

[[bin]]
name = "starplayer-embedded-xtask"
path = "src/main.rs"

# Argument parsing stays dependency-free — thirty lines of `match` beats a `clap` lock file
# entry. `flate2` is the one exception: `assets` gzips `www/index.html` into
# `assets/index.html.gz` for the firmware to link, and shelling out to a system `gzip`
# would make that step non-reproducible across the machines this runs on. Default features
# pull in `miniz_oxide`, a pure-Rust deflate implementation, rather than linking the
# system's zlib — one less thing the build depends on finding on `PATH`.
[dependencies]
flate2 = "1"
