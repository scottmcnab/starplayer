[package]
name = "starplayer-embedded-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Build orchestration for the StarPlayer firmware workspace: build, image, size, flash, monitor."
publish = false

[[bin]]
name = "starplayer-embedded-xtask"
path = "src/main.rs"

# No dependencies, deliberately. Argument parsing here is thirty lines of `match`; a `clap`
# would put a dozen crates into a lock file whose only other entries are the firmware's, and
# `cargo xtask` has to be the one command that always builds.
[dependencies]
