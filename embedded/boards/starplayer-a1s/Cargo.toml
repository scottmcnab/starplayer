[package]
name = "starplayer-a1s"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "StarPlayer firmware for the AI-Thinker ESP32-Audio-Kit (ESP32-A1S, ES8388 codec)."

[[bin]]
name = "starplayer-a1s"
path = "src/main.rs"
# The built-in test harness needs `std`; without this, `cargo build` on the bare-metal
# target tries to build a test harness for the binary and rust-analyzer reports phantom
# errors. Same reason ampkeeper's firmware sets it.
test = false
harness = false

[features]
# Nothing by default: the plain build is the audio firmware, and every feature below adds
# something to it. `cargo xtask build --board a1s` builds exactly this set.
default = []

# Render the six golden fixtures and print their hashes and cycle counts over UART; make
# no sound and touch neither the codec nor I2S. The transcript this produces **is**
# `plans/reference/embedded-budget.md`'s data. It instantiates all four interpolators,
# where the audio build instantiates `Linear` alone — which is why the two builds' flash
# figures are worth comparing.
bench = []

# M8-I5: the ST7789 now-playing screen on the SD-card pin group. Off by default — the
# audio build must not link `mipidsi`/`embedded-graphics`/`embedded-hal-bus` at all (M8
# master-plan decision 4), so the three are `optional = true` below and pulled in only by
# naming their `dep:` form here.
lcd = ["dep:mipidsi", "dep:embedded-graphics", "dep:embedded-hal-bus"]

# M8-I6: the captive portal, the HTTP/WebSocket API and module upload. Off by default,
# and every crate it needs is `optional = true` below, so the default, `lcd` and `bench`
# builds link exactly what they linked before this feature existed — the radio, the TCP/IP
# stack and the HTTP server are more flash and more DRAM than the audio build should ever
# pay for when nobody asked for a network.
web = [
    "dep:esp-radio",
    "dep:esp-storage",
    "dep:embassy-net",
    "dep:embassy-futures",
    "dep:picoserve",
    "dep:edge-mdns",
    "dep:edge-nal",
    "dep:edge-nal-embassy",
    "dep:sequential-storage",
    "dep:embassy-embedded-hal",
    "dep:embedded-storage",
    "dep:embedded-storage-async",
    "dep:embedded-io-async",
    "dep:serde",
    "dep:serde-json-core",
    "dep:heapless",
    "esp-rtos/esp-radio",
]

# Every `esp-*` crate lives in a per-target table, never in a plain `[dependencies]`.
# Putting them in the plain table would drag them into a host `cargo metadata` — they only
# compile for their own triple — and break `cargo test -p starplayer-firmware-common` from
# the workspace root. Cargo applies this table by build triple, so `--target
# xtensa-esp32-none-elf` selects it and nothing else has to.
#
# Versions mirror `../ampkeeper/esp32/firmware/Cargo.toml`'s classic-ESP32 table, which is
# the combination that ran daily on this chip family. `esp-radio` and `esp-storage` are
# deliberately absent: no radio until M8-I6, and no flash writes at all in this milestone.
[target.xtensa-esp32-none-elf.dependencies]
esp-hal = { version = "1.1.1", features = ["esp32", "unstable"] }
# `unstable` is what gates I2S, DMA and PSRAM in esp-hal 1.1; none of the three has a
# stable API yet.
esp-rtos = { version = "0.3.0", features = ["esp32", "embassy", "log-04"] }
esp-println = { version = "0.17.0", features = ["esp32", "log-04"] }
esp-backtrace = { version = "0.19.0", features = ["esp32", "panic-handler", "println"] }
esp-alloc = "0.10.0"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
embedded-hal = "1"
embedded-hal-async = "1"

# M8-I6's `web` feature. Versions are `../ampkeeper/esp32/firmware`'s classic-ESP32 table
# (its tree before `aeb9039`, "Collapse the chip feature axis"), which is the combination
# that ran daily on this chip with this radio.
#
# `esp-radio` carries no `init` of its own in 0.18: `esp_rtos::start` must run first, then
# `esp_radio::wifi::new` brings the controller up — which is why `esp-rtos` gains its
# `esp-radio` feature from the `web` feature above rather than carrying it unconditionally.
# `unstable` is what gates `WifiController::is_connected`, the scan configuration and
# the controller queue depths in 0.18, the same way `esp-hal`'s gates I2S and PSRAM.
esp-radio = { version = "0.18.0", features = ["esp32", "wifi", "log-04", "unstable"], optional = true }
# Flash reads and writes for the `config` and `modules` partitions. See `store.rs` for the
# cache hazard this brings with it.
esp-storage = { version = "0.9.0", features = ["esp32"], optional = true }

# Chip-independent crates. These build for any target, so they sit in the plain table.
[dependencies]
embassy-executor = { version = "0.10.0", features = ["nightly"] }
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
static_cell = "2.1.0"
critical-section = "1"
log = "0.4"

starplayer = { workspace = true }
starplayer-host-embedded = { workspace = true }
starplayer-model = { workspace = true }
firmware-common = { workspace = true }
bytemuck = { workspace = true }

# M8-I5's `lcd` feature only — see the `lcd` feature entry above for why these are
# `optional`. Chip-agnostic (none is an `esp-*` crate), so the plain table is still the
# right place for them; `cfg(feature = "lcd")` in `src/lcd.rs` is what actually keeps
# them out of the default build's dependency graph at compile time, not this table.
mipidsi = { workspace = true, optional = true }
embedded-graphics = { workspace = true, optional = true }
embedded-hal-bus = { workspace = true, optional = true }

# M8-I6's `web` feature — chip-agnostic, so the plain table, same reasoning as the `lcd`
# crates above. `embassy-net`'s `medium-ethernet` is what the WiFi interface presents (and
# what `picoserve` requires); `multicast` is what mDNS needs to join 224.0.0.251.
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dhcpv4", "dns", "proto-ipv4", "medium-ethernet", "multicast"], optional = true }
embassy-futures = { version = "0.1.2", optional = true }
picoserve = { version = "0.18.0", features = ["alloc", "embassy", "json", "ws"], optional = true }
edge-mdns = { version = "0.8.0", default-features = false, features = ["io"], optional = true }
edge-nal = { version = "0.7.0", optional = true }
edge-nal-embassy = { version = "0.9.0", default-features = false, features = ["udp", "multicast", "proto-ipv4"], optional = true }
sequential-storage = { version = "8.0.0", default-features = false, optional = true }
embassy-embedded-hal = { version = "0.6.0", optional = true }
embedded-storage = { version = "0.3.1", optional = true }
embedded-storage-async = { version = "0.4.1", optional = true }
embedded-io-async = { version = "0.7.0", optional = true }
serde = { workspace = true, optional = true }
serde-json-core = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }

[package.metadata.espflash]
partition_table = "partitions.csv"
