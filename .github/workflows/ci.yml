# Every host job here is a single `cargo xtask ci --job <job>` invocation, and
# `cargo xtask ci` runs that set locally. The ARM64 golden job repeats the same xtask job
# natively. The WASIp1 job is the one exception: xtask is a host executable, so CI builds
# and runs the golden helper itself under Wasmtime.
#
# The toolchain, including the wasm32 and riscv32 targets, comes from
# rust-toolchain.toml; `rustup show` installs it.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci --job host-tests

  goldens-x86-64:
    name: golden hashes (x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci --job goldens

  goldens-aarch64:
    name: golden hashes (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci --job goldens

  goldens-wasm32:
    name: golden hashes (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "46.0.2"
      - name: Build canonical renderer for WebAssembly
        run: cargo build --release --target wasm32-wasip1 -p starplayer-offline --bin starplayer-goldens
      - name: Compare WebAssembly hashes with the committed x86-64 contract
        run: wasmtime --dir=. target/wasm32-wasip1/release/starplayer-goldens.wasm --check

  fma-check:
    name: float FMA contraction audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci --job fma-check

  conformance:
    name: conformance corpora
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Restore pinned corpus
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: target/conformance
          key: conformance-libxmp-6ec0ba21b1b28f91e22b68a51d59207c6bbf6139
      - name: Acquire and verify pinned corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: cargo xtask conformance --fetch-only
      - name: Run with live corpus acquisition disabled
        run: cargo xtask ci --job conformance

  wasm-build:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci --job wasm-build

  no-std-check:
    name: no_std check (bare metal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci --job no-std-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci --job clippy

  no-std-purity:
    name: no-std purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci --job no-std-purity
