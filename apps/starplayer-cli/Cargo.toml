[package]
name = "starplayer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# `smf`: task E5's `.mid` support in `info`/`render`. Resolver 2 already unifies this on
# through `starplayer-offline` below, which needs it unconditionally; named here too so
# this crate's own `use starplayer::midi::...` reads honestly against its own manifest.
starplayer = { workspace = true, features = ["std", "smf"] }
# `trace` is optional on `starplayer-offline` so that goldens never compile the per-tick
# recorder in, and it is optional here for the same reason one level up: resolver 2
# unifies features across a workspace build, so a CLI that always asked for it would put
# the allocating recorder inside `render()` for every crate's tests — the host crate's
# allocation tests catch exactly that. `cargo build -p starplayer-cli --features trace`
# enables the `trace` command; without it the command explains how to get it.
starplayer-offline = { workspace = true }
starplayer-archive = { workspace = true }
# `play` (task D8): the backend-neutral controller and the cpal driver behind it.
starplayer-host = { workspace = true }
starplayer-host-cpal = { workspace = true }
# `play --midi` (task E6): a `midir` input port feeding the player's live-input queue.
starplayer-midi-native = { workspace = true }
clap = { workspace = true }
# `render` prints the SHA-256 of its PCM payload (task D5 deliverable 2), in the same
# little-endian encoding `starplayer-offline` hashes goldens with. The integration tests
# reuse it too, so there is no separate `[dev-dependencies]` entry.
sha2 = { workspace = true }
# `play`'s Ctrl-C handling: a click-free stop rather than the process dying mid-ramp.
ctrlc = { workspace = true }

[features]
default = []
trace = ["starplayer-offline/trace"]
