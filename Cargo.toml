# StarPlayer — virtual workspace root.
#
# Deliberately has no `[package]`: every crate lives under `crates/`, `apps/` or
# `xtask/`. There is no `license` field anywhere in this workspace — licensing is
# deferred (see plans/product/00-vision.md decision 7).

[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

# Every external version is pinned once here; members write `{ workspace = true }`.
# Internal path dependencies are listed so the dependency graph is declared in one
# place and a crate can be moved without touching every sibling manifest.
[workspace.dependencies]
# External crates. Both are `no_std` with their default feature sets, which is what
# keeps design goal 4 (no default feature transitively enables `std`) satisfiable.
fixed = { version = "1.31", default-features = false }
bitflags = { version = "2.13", default-features = false }

# Archive decoding stays on the pure-Rust miniz_oxide path for native and wasm builds.
# Do not use zip's broad `deflate` feature: it also enables compressor and zlib-rs code
# that the read-only module archive path does not need.
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Canonical golden renders are SHA-256 fingerprints. Hashing lives in the std-only
# offline crate; no digest code or dependency enters the real-time graph.
sha2 = { version = "0.10", default-features = false }

# The CLI's argument surface (task D5). `std`-only like every app crate; no core crate
# ever depends on it, so its default features are not a `no_std` purity concern here.
clap = { version = "4.6", features = ["derive"] }

# Native audio output for `starplayer-host-cpal`. A `std` crate, reachable only from the
# host crates and never from the engine, so it cannot threaten design goal 4.
#
# `pulseaudio` adds cpal's pure-Rust PulseAudio host alongside the ALSA one it always
# builds on Linux. It costs no system dependency — the `pulseaudio` crate speaks the
# protocol itself rather than binding `libpulse` — and it is the only host that finds a
# device on a machine whose ALSA has no card, which is every WSL2 box and most containers.
# Its sibling `pipewire` feature is deliberately off: it binds `libpipewire`, which is a
# system dependency, and PulseAudio reaches a PipeWire server through its own compatibility
# socket anyway. cpal's own default feature set is empty, so `default-features = false` only
# says so out loud.
cpal = { version = "0.18.2", default-features = false, features = ["pulseaudio"] }

# The CLI's `play` command's Ctrl-C handling (task D8): install once, from the one
# thread that also owns the player's command ring, and turn the signal into a flag the
# polling loop checks — never a call into the player from the handler's own thread.
ctrlc = { version = "3.5.2" }

# Native MIDI *input* for `starplayer-midi-native` (task E6). A `std` crate reachable only
# from that host crate, so like cpal it cannot threaten design goal 4. On Linux it binds
# the ALSA **sequencer** (`libasound`'s `snd_seq_*`), which is the same `alsa-lib` cpal's
# PCM host needs and therefore the same header story: `sudo apt install libasound2-dev`,
# or a `PKG_CONFIG_PATH` naming an `alsa-lib` prefix. `winmm`/CoreMIDI need nothing extra.
# midir's own default feature set is empty — the ALSA, CoreMIDI and WinMM backends and
# their virtual ports are unconditional — so `default-features = false` only says out loud
# that the optional `jack` feature stays off: it binds `libjack`, a system dependency, for
# a server this project does not require.
midir = { version = "0.11", default-features = false }

# The real-time plumbing's three dependencies, all `no_std` and none enabling `std` at
# the feature set selected here. See `crates/starplayer-rt/src/lib.rs` for why each one
# is needed rather than hand-written.
#
# `portable-atomic` provides the atomics that `core` does not have on
# `riscv32imc-unknown-none-elf`, which has no `A` extension at all: plain aligned
# load/store are provided natively with no feature flags, which is all an SPSC ring
# needs. Compare-and-swap is *not* available there by default, so the manifest of
# `starplayer-rt` turns on `critical-section` for exactly those targets.
portable-atomic = { version = "1.15", default-features = false }
# `Arc` for targets without CAS, where `alloc::sync::Arc` does not exist.
portable-atomic-util = { version = "0.2", default-features = false, features = ["alloc"] }
# The lock-free SPSC ring itself. A wait-free SPSC cannot be written in safe Rust — the
# producer and the consumer hold disjoint mutable views of one buffer, which the borrow
# checker cannot express — and every core crate here is `#![forbid(unsafe_code)]`, so the
# unsafe lives in a well-tested audio-oriented dependency instead of in our tree.
ringbuf = { version = "0.5", default-features = false, features = ["alloc", "portable-atomic"] }

starplayer = { path = "crates/starplayer" }
starplayer-core = { path = "crates/starplayer-core" }
starplayer-rt = { path = "crates/starplayer-rt" }
starplayer-dsp = { path = "crates/starplayer-dsp" }
starplayer-mixer = { path = "crates/starplayer-mixer" }
starplayer-model = { path = "crates/starplayer-model" }
starplayer-engine = { path = "crates/starplayer-engine" }
starplayer-mod = { path = "crates/starplayer-mod" }
starplayer-s3m = { path = "crates/starplayer-s3m" }
starplayer-mtm = { path = "crates/starplayer-mtm" }
starplayer-xm = { path = "crates/starplayer-xm" }
starplayer-it = { path = "crates/starplayer-it" }
starplayer-midi = { path = "crates/starplayer-midi" }
starplayer-midi-native = { path = "crates/starplayer-midi-native" }
starplayer-telemetry = { path = "crates/starplayer-telemetry" }
starplayer-host = { path = "crates/starplayer-host" }
starplayer-host-cpal = { path = "crates/starplayer-host-cpal" }
starplayer-host-wasm = { path = "crates/starplayer-host-wasm" }
starplayer-archive = { path = "crates/starplayer-archive" }
starplayer-offline = { path = "crates/starplayer-offline" }
starplayer-testkit = { path = "crates/starplayer-testkit" }

# ── external ────────────────────────────────────────────────────────────────────────
#
# `wasm-bindgen` is pinned to an *exact* version on purpose: the generated glue and the
# `wasm-bindgen` CLI that post-processes it must be the same version, and the CLI is
# installed outside cargo. `xtask wasm` checks the two agree before it builds.
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
