[package]
name = "starplayer-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# `fixed` carries no transitive dependencies at its default feature set and is `no_std`
# unless `std` is opted into, so it costs nothing on the bare-metal target.
fixed = { workspace = true }
bitflags = { workspace = true }

[features]
default = []
# `std` is never part of any default feature set (AGENTS.md design goal 4).
std = ["fixed/std"]
alloc = []
serde = []
# Select the original DOS player's own profile as the per-dialect default instead of the
# canonical one. See plans/product/03-accuracy-policy.md section 2 and
# `QuirkSet::profile_default`. Pure data: it gates no code and costs nothing at runtime.
quirks-starplayer = []
