[package]
name = "starplayer-xm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
starplayer-engine = { workspace = true }
starplayer-model = { workspace = true }

[features]
default = []
std = ["starplayer-engine/std", "starplayer-model/std"]
alloc = ["starplayer-engine/alloc", "starplayer-model/alloc"]
serde = ["starplayer-engine/serde", "starplayer-model/serde"]
