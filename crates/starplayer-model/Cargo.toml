[package]
name = "starplayer-model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
starplayer-core = { workspace = true }
# The one safe way to reinterpret a module image's PCM region as `&[i16]` without a
# `transmute`: this crate is `#![forbid(unsafe_code)]`, and `try_cast_slice` does the
# alignment and length checks the borrow needs anyway — a misaligned image has to be an
# `Err` rather than a silent copy (`src/image.rs`). `no_std` with no default features, and
# already in the graph underneath `fixed`.
bytemuck = { workspace = true }

[dev-dependencies]
# Test-only, and deliberately not a normal dependency: `starplayer-model` does not depend
# on `starplayer-mixer` (the edges are model → core and mixer → core, dsp). This lets
# `builder::tests::a_ping_pong_guard_matches_the_mixers_own_arithmetic` build the same
# sample through both `ModuleBuilder::add_sample` and
# `starplayer_mixer::sample::append_guarded_sample` and assert the guard frames agree —
# the ping-pong guard contract the builder has to honour (task E1).
starplayer-mixer = { workspace = true }

[features]
default = []
std = ["starplayer-core/std"]
alloc = ["starplayer-core/alloc"]
serde = ["starplayer-core/serde"]
