[package]
name = "starplayer-host-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# `cdylib` is what the browser loads; `rlib` keeps the crate usable as a normal Rust
# dependency so `cargo test --workspace` can exercise the command ring, module loading
# and a real render on the host without a browser in the loop.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# M10-K5a/W4: `enhance` gives the worklet `starplayer::enhance::{CATALOGUE, from_flags}`
# for the load-time sample-enhancer checkboxes. It is enabled unconditionally, not as an
# optional feature of this crate, because the packaged web player is built with
# `cargo xtask wasm`'s plain `cargo build -p starplayer-host-wasm` and the checkboxes must
# work in that build, unlike `simd` below, which the shipped page deliberately excludes.
starplayer = { workspace = true, features = ["std", "telemetry", "enhance"] }
# The backend-neutral half of a host. This crate implements `AudioBackend` over the
# browser's audio graph and drives `Player` through it, so the engine arms, the transport,
# the song fade, the seek mailbox and the output-depth post-stage all live there (task D9).
starplayer-host = { workspace = true }
wasm-bindgen = { workspace = true }

[features]
default = []
# M7-H6's vector kernels, on the browser's simd128 backend. Off by default and **not**
# what the packaged web player is built with — that stays H7's build — but
# `cargo xtask ci --job wasm-build` compiles this arm with
# `RUSTFLAGS=-C target-feature=+simd128`, which is the only place `wide`'s wasm backend is
# exercised at all.
simd = ["starplayer/simd"]
