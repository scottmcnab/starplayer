[package]
name = "starplayer-offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
starplayer = { workspace = true, features = ["std"] }
sha2 = { workspace = true }

# `trace` must stay **optional**. Declared as an ordinary dependency feature it would be
# unified across the whole workspace by resolver 2, so `cargo test --workspace` would
# build the engine — and the wasm host — with the per-tick recorder compiled into
# `render()`, and would never test-compile the `cfg(not(feature = "trace"))` arms at all.
# The golden binary must build without it; only `starplayer-trace` requires it.
[features]
default = []
trace = ["starplayer/trace"]
# The engine's per-tick telemetry publish is exactly the "just for telemetry" path
# architecture §8 warns about, so `tests/render_allocation.rs` has to be able to arm the
# allocator hook with it compiled in. Optional for the same reason `trace` is: declared as
# an ordinary dependency feature it would be unified across the whole workspace and every
# golden render would carry the publisher. `cargo xtask ci --job rt-safety` runs the suite
# once without it and once with it.
telemetry = ["starplayer/telemetry"]

# The XM loader by path, for `tests/fuzz_seeds.rs` only. The facade's `xm` arm is task
# F2; until it lands there is no `starplayer::xm` to replay the seeds through, and a
# dev-dependency reaches the loader without touching the facade or anything a host links.
# IT no longer needs one: G3 wired `starplayer::it` into the facade's default features.
[dev-dependencies]
starplayer-xm = { workspace = true, features = ["std"] }

[[bin]]
name = "starplayer-trace"
required-features = ["trace"]
