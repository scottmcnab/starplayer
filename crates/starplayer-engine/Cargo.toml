[package]
name = "starplayer-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
starplayer-core = { workspace = true }
starplayer-rt = { workspace = true }
starplayer-dsp = { workspace = true }
starplayer-mixer = { workspace = true }
starplayer-model = { workspace = true }
# Optional, and only reachable through the `telemetry` feature below.
starplayer-telemetry = { workspace = true, optional = true }

[features]
default = []
std = ["starplayer-core/std", "starplayer-rt/std", "starplayer-dsp/std", "starplayer-mixer/std", "starplayer-model/std", "starplayer-telemetry?/std"]
alloc = ["starplayer-core/alloc", "starplayer-rt/alloc", "starplayer-dsp/alloc", "starplayer-mixer/alloc", "starplayer-model/alloc", "starplayer-telemetry?/alloc"]
simd = ["starplayer-dsp/simd", "starplayer-mixer/simd"]
float-mix = ["starplayer-dsp/float-mix", "starplayer-mixer/float-mix"]
fixed-mix = ["starplayer-dsp/fixed-mix", "starplayer-mixer/fixed-mix"]
linear-interp = ["starplayer-dsp/linear-interp", "starplayer-mixer/linear-interp"]
serde = ["starplayer-core/serde", "starplayer-model/serde", "starplayer-telemetry?/serde"]
# Publishes the telemetry snapshots (M1-B6). The snapshot *types* live in
# `starplayer-telemetry` and the engine takes an **optional** dependency on it here, which
# is the honest graph: only the engine can fill a snapshot in coherently, so the edge has
# to run engine → telemetry. Architecture section 11 records it. (A stub-time comment in
# this file said the opposite; it was a guess made before either crate had contents.)
telemetry = ["dep:starplayer-telemetry"]
# Per-tick state trace. Test and debug only, never on in a shipping default.
trace = []
